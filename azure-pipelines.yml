trigger: none

pool:
  name: Default

variables:
  APP_DIR: '/home/azureuser/todoapi'
  VENV_DIR: '/home/azureuser/PyTodoBackendMonolith/venv'
  SERVICE_NAME: 'pytodo'

stages:

# ============================================================
# BUILD STAGE
# ============================================================

- stage: Build
  displayName: Build & Code Quality

  jobs:

  - job: BuildPythonApp
    displayName: Build Python Application

    steps:

    # --------------------------------------------------------
    # Checkout Repository
    # --------------------------------------------------------

    - checkout: self


    # --------------------------------------------------------
    # Python + Ruff
    # --------------------------------------------------------

    - task: PowerShell@2
      displayName: Check Python Version & Install Ruff
      inputs:
        targetType: 'inline'
        script: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m ruff --version


    # --------------------------------------------------------
    # Create ZIP Artifact
    # --------------------------------------------------------

    - task: ArchiveFiles@2
      displayName: Create Application ZIP
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/app.py'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/artifact.zip'
        replaceExistingArchive: true


    # --------------------------------------------------------
    # Publish Artifact
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: Publish Application Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/artifact.zip'
        artifact: 'todoapi_package'
        publishLocation: 'pipeline'


# ============================================================
# DEPLOY STAGE
# ============================================================

- stage: Deploy
  displayName: Deploy Application to VM

  dependsOn:
  - Build

  jobs:

  - deployment: deployPy
    displayName: Deploy Python Backend

    environment:
      name: vivek-ENV
      resourceType: virtualMachine

    strategy:
      runOnce:
        deploy:

          steps:

          # --------------------------------------------------
          # Download Artifact
          # --------------------------------------------------

          - task: DownloadPipelineArtifact@2
            displayName: Download Build Artifact
            inputs:
              buildType: 'current'
              artifactName: 'todoapi_package'
              targetPath: '$(Pipeline.Workspace)/todoapi_package'


          # --------------------------------------------------
          # Deploy Application
          # --------------------------------------------------

          - task: Bash@3
            displayName: Stop Service, Deploy Code & Restart
            inputs:
              targetType: 'inline'
              script: |

                set -e

                echo "================================="
                echo "     PYTHON BACKEND DEPLOY"
                echo "================================="

                echo "Stopping old service..."

                sudo systemctl stop $(SERVICE_NAME) || true


                echo "Creating application directory..."

                sudo mkdir -p $(APP_DIR)


                echo "Cleaning old application files..."

                sudo rm -rf $(APP_DIR)/*


                echo "Extracting application..."

                sudo unzip -o \
                  "$(Pipeline.Workspace)/todoapi_package/artifact.zip" \
                  -d "$(APP_DIR)"


                echo "Checking deployed files..."

                ls -la "$(APP_DIR)"


                echo "Setting ownership..."

                sudo chown -R $(whoami):$(whoami) "$(APP_DIR)"


                echo "Checking Python dependencies..."

                "$(VENV_DIR)/bin/python" -c "import fastapi, uvicorn, pyodbc"


                echo "Testing application import..."

                cd "$(APP_DIR)"

                "$(VENV_DIR)/bin/python" -c "import app; print('APP IMPORT: SUCCESS')"


                echo "Creating systemd service..."

                sudo tee /etc/systemd/system/$(SERVICE_NAME).service > /dev/null <<EOF
                [Unit]
                Description=Todo API Uvicorn App
                After=network-online.target
                Wants=network-online.target

                [Service]
                Type=simple
                User=$(whoami)
                WorkingDirectory=$(APP_DIR)

                Environment="PYTHONUNBUFFERED=1"

                ExecStart=$(VENV_DIR)/bin/python -m uvicorn app:app --host 0.0.0.0 --port 8000

                Restart=always
                RestartSec=5

                StandardOutput=journal
                StandardError=journal

                [Install]
                WantedBy=multi-user.target
                EOF


                echo "Reloading systemd..."

                sudo systemctl daemon-reload


                echo "Enabling service..."

                sudo systemctl enable $(SERVICE_NAME)


                echo "Starting service..."

                sudo systemctl start $(SERVICE_NAME)


                echo "Waiting for application startup..."

                for i in {1..15}
                do
                  echo "Health check attempt $i/15..."

                  if curl -fsS http://127.0.0.1:8000/api > /tmp/todoapi_health.txt
                  then
                    echo "================================="
                    echo "     API IS UP"
                    echo "================================="

                    cat /tmp/todoapi_health.txt

                    echo ""
                    echo "Deployment successful!"

                    exit 0
                  fi

                  echo "API not ready yet..."

                  sleep 2
                done


                echo "================================="
                echo "     DEPLOYMENT FAILED"
                echo "================================="

                echo ""
                echo "SERVICE STATUS:"
                sudo systemctl status $(SERVICE_NAME) --no-pager || true

                echo ""
                echo "SERVICE LOGS:"
                sudo journalctl -u $(SERVICE_NAME) -n 100 --no-pager || true

                echo ""
                echo "APPLICATION FILES:"
                ls -la "$(APP_DIR)" || true

                exit 1
