trigger: none

pool: Default

variables:
  APP_DIR: '/home/azureuser/todoapi'
  VENV_DIR: '/home/azureuser/PyTodoBackendMonolith/venv'
  SERVICE_NAME: 'pytodo'

stages:

# ============================================================
# BUILD STAGE
# ============================================================
- stage: Build
  displayName: Build & Code Quality

  jobs:
  - job: BuildPythonApp
    displayName: Build Python Application

    steps:

    # --------------------------------------------------------
    # 1. Checkout GitHub Repository
    # --------------------------------------------------------
    - checkout: self

    # --------------------------------------------------------
    # 2. Install / Verify Python + Ruff
    # --------------------------------------------------------
    - task: PowerShell@2
      displayName: Check Python Version & Install Ruff
      inputs:
        targetType: 'inline'
        script: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m ruff --version

    # --------------------------------------------------------
    # 3. Ruff Linting
    # --------------------------------------------------------
    # Enable this after fixing all Ruff issues in app.py
    # --------------------------------------------------------
    # - task: PowerShell@2
    #   displayName: Run Python Linting (Ruff)
    #   inputs:
    #     targetType: 'inline'
    #     script: |
    #       python -m ruff check "$(Build.SourcesDirectory)/app.py"

    # --------------------------------------------------------
    # 4. Create ZIP
    # --------------------------------------------------------
    - task: ArchiveFiles@2
      displayName: Create Application ZIP
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)/app.py'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/artifact.zip'
        replaceExistingArchive: true

    # --------------------------------------------------------
    # 5. Verify ZIP
    # --------------------------------------------------------
    - task: PowerShell@2
      displayName: Verify Application ZIP
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Artifact staging directory:"
          Get-ChildItem "$(Build.ArtifactStagingDirectory)"

          Write-Host "Checking artifact.zip..."
          if (Test-Path "$(Build.ArtifactStagingDirectory)/artifact.zip") {
              Write-Host "artifact.zip found successfully."
          }
          else {
              Write-Error "artifact.zip was not created."
              exit 1
          }

    # --------------------------------------------------------
    # 6. Publish ZIP Artifact
    # --------------------------------------------------------
    - task: PublishPipelineArtifact@1
      displayName: Publish Application Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/artifact.zip'
        artifact: 'todoapi_package'
        publishLocation: 'pipeline'


# ============================================================
# DEPLOY STAGE
# ============================================================
- stage: Deploy
  displayName: Deploy Application to VM

  dependsOn: Build
  condition: succeeded()

  jobs:

  - deployment: deployPy
    displayName: Deploy Python Backend

    environment:
      name: vivek-ENV
      resourceType: virtualMachine

    strategy:
      runOnce:
        deploy:
          steps:

          # --------------------------------------------------
          # 1. Download Build Artifact
          # --------------------------------------------------
          - task: DownloadPipelineArtifact@2
            displayName: Download Build Artifact
            inputs:
              buildType: 'current'
              artifactName: 'todoapi_package'
              targetPath: '$(Pipeline.Workspace)/todoapi_package'

          # --------------------------------------------------
          # 2. Deploy Application
          # --------------------------------------------------
          - task: Bash@3
            displayName: Stop Service, Deploy Code & Restart
            inputs:
              targetType: 'inline'
              script: |

                set -e

                echo "========================================"
                echo "       PYTHON BACKEND DEPLOYMENT"
                echo "========================================"

                echo ""
                echo "===== ARTIFACT CHECK ====="

                ls -lah "$(Pipeline.Workspace)/todoapi_package"

                test -f "$(Pipeline.Workspace)/todoapi_package/artifact.zip"

                echo ""
                echo "===== STOP APPLICATION ====="

                sudo systemctl stop $(SERVICE_NAME) || true

                echo ""
                echo "===== CREATE APPLICATION DIRECTORY ====="

                sudo mkdir -p "$(APP_DIR)"

                echo ""
                echo "===== CLEAN OLD APPLICATION ====="

                sudo find "$(APP_DIR)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

                echo ""
                echo "===== EXTRACT NEW APPLICATION ====="

                sudo unzip -o \
                  "$(Pipeline.Workspace)/todoapi_package/artifact.zip" \
                  -d "$(APP_DIR)"

                echo ""
                echo "===== VERIFY APPLICATION FILE ====="

                ls -lah "$(APP_DIR)"

                test -f "$(APP_DIR)/app.py"

                echo ""
                echo "===== SET OWNERSHIP ====="

                sudo chown -R $(whoami):$(whoami) "$(APP_DIR)"

                echo ""
                echo "===== CREATE SYSTEMD SERVICE ====="

                sudo tee "/etc/systemd/system/$(SERVICE_NAME).service" > /dev/null <<EOF
                [Unit]
                Description=Todo API Uvicorn App
                After=network.target

                [Service]
                User=$(whoami)
                WorkingDirectory=$(APP_DIR)
                ExecStart=$(VENV_DIR)/bin/uvicorn app:app --host 0.0.0.0 --port 8000
                Restart=always
                RestartSec=5

                [Install]
                WantedBy=multi-user.target
                EOF

                echo ""
                echo "===== RELOAD SYSTEMD ====="

                sudo systemctl daemon-reload

                echo ""
                echo "===== ENABLE SERVICE ====="

                sudo systemctl enable $(SERVICE_NAME)

                echo ""
                echo "===== START SERVICE ====="

                sudo systemctl start $(SERVICE_NAME)

                echo ""
                echo "===== SERVICE STATUS ====="

                sudo systemctl --no-pager status $(SERVICE_NAME)

                echo ""
                echo "===== APPLICATION HEALTH CHECK ====="

                curl -f http://localhost:8000/api

                echo ""
                echo "========================================"
                echo "      DEPLOYMENT SUCCESSFUL"
                echo "========================================"



